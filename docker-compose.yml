services:
  overload:
    build: .
    image: overload:latest
    restart: unless-stopped
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      PORT: 3000
      DATABASE_URL: postgres://overload:${DB_PASSWORD}@overload-db:5432/overload
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEFAULT_UNIT: ${DEFAULT_UNIT:-lb}
      # UI origins allowed to call the API cross-origin (e.g. a GitHub Pages host)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AUTH_TOKENS_ENABLED: ${AUTH_TOKENS_ENABLED:-true}
      TZ: ${TZ:-UTC}
    # Published so NGINX Proxy Manager (and a direct LAN-IP:port for AT&T
    # split-DNS at home) can both reach it.
    ports:
      - '${OVERLOAD_PORT:-3000}:3000'
    depends_on:
      overload-db:
        condition: service_healthy

  overload-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: overload
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: overload
    volumes:
      - overload-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U overload']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  overload-pgdata:
